frequency_range_hz: [45, 18000]
source:
  url: https://products.electrovoice.com/downloadfile.php?id=968996
  page: 2
  chart: "Frequency Response (lower/bottom plot: dual-voicing switch RIGHT-hand position = general/flat voicing for voice, acoustic & amplified instruments; SOLID 'AVERAGE RESPONSE' line)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Headless seeded-viterbi trace (digitizer/cli.js) of the official EV RE320 Engineering
  Data Sheet frequency-response charts, page 2 (Part Number F.01U.196.202 Rev 03, 08/2012).
  The RE320 has a dual-voicing (two-position) switch; the data sheet plots the two positions
  as TWO SEPARATE stacked charts (NOT two curves on one chart): the TOP chart is annotated
  "engineered specifically for kick drum" (left-hand switch position, kick voicing) and the
  BOTTOM chart is annotated "engineered specifically for voice, acoustic instruments and
  amplified instruments" (right-hand switch position, general/flat voicing). Only the BOTTOM
  (general / flat / position-1) chart was digitized, per the "digitize the flat/general-purpose
  curve as typical" instruction.
  Each chart itself carries two lines: a DOTTED line = close-mic response at 1 cm (proximity-
  boosted, labelled "1 cm") and a SOLID line = the nominal far-field "AVERAGE RESPONSE". The
  SOLID average-response line was traced (the dotted 1 cm proximity line was deliberately NOT
  digitized). Seeded on the solid line in the flat mid region at ~2.5 kHz / +0.4 dB (px 664,182
  in the plot-area crop), avoiding the dotted "1 cm" line above it, the "AVERAGE RESPONSE" text
  below it, and the black vertical gridlines. Viterbi continuity kept the trace on the solid line
  without hopping onto the dotted 1 cm line (which descends toward the solid near 600 Hz-1 kHz),
  the same-color (black) gridlines, or the text (--max-jump 8). Full-resolution trace (783
  px-columns) reduced with --simplify 0.05 (dB-perceptual lossless, Douglas-Peucker vertical
  variant) to 149 points.
  Calibration read from axis LABEL VALUES (not inferred from log spacing): X anchored on the
  100 Hz and 10 kHz decade gridlines (px 226 / 853 in the plot-area crop; 313.5 px/decade,
  cross-checked against the 20/50/200/500/1k/2k/5k/20k labelled gridlines). Y anchored on the
  horizontal gridlines at 5 dB/division; +10 dB at py 96, -10 dB at py 277 (0 dB at py 186),
  ~9.05 px/dB.
  Anti-circularity calibration cross-check (defeats log-axis self-similarity): the data sheet's
  Architects'/Engineers' text names the general-curve HF features "gradual rise to +4 dB at
  5,000 Hz ... an additional +4 dB rise centered at 10,000 Hz." The traced solid curve reaches
  +4.3 dB at ~5.0-5.4 kHz and +4.4 dB at ~9.8 kHz -- both named peaks land at the correct
  frequency AND level, which a whole-axis (decade) frequency shift could not reproduce. (The
  "45 Hz / -3 dB" low-frequency spec was NOT used as a cross-check: the published LF -3 dB
  bandpass edge corresponds to the close-mic'd / proximity condition, whereas the digitized
  far-field solid curve rolls off earlier -- ~-7 dB already at 50 Hz.)
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: seeded-pixel-trace
    condition: "typical on-axis (0deg) response, dual-voicing switch in GENERAL/FLAT position (right-hand switch position; solid far-field AVERAGE RESPONSE line, as published). NOT the kick-drum voicing; NOT the 1 cm close/proximity line."
verification:
  method: "overlay --interpolated vs original chart (scripts/overlay_verify.py, window 12 px ~= +/-1.3 dB)"
  date: 2026-07-09
  result: >
    149 points, 0 gaps. Interpolated (per-column re-draw fidelity over 772 measured columns):
    median |dev| 0.016 dB, max |dev| 0.733 dB. Point-wise: median |dev| 0.005 dB, max |dev|
    0.169 dB, all 149 points within +/-1.0 dB. 39 ambiguous columns (window filled by the dense
    black vertical gridlines in the 500 Hz-1 kHz and 5 kHz-20 kHz decades) -- inherent to a
    black-gridline scanned chart; visual overlay confirms the trace sits on the solid
    general-voicing curve throughout with no confusion with the dotted 1 cm line, the black
    gridlines, or the "AVERAGE RESPONSE" text. (A wider window 18 px reported a single +1.50 dB
    outlier at 805 Hz -- verified as the descending dotted 1 cm line entering the wider window,
    not a trace error: the traced value at 805 Hz is -0.17 dB, correctly on the solid line.)
  note: >
    Chart is ground truth. The A&E text's nominal general-curve "down 2 dB at 4,200 Hz" dip is
    only faintly present as a shallow inflection on the plotted solid curve (which rises roughly
    monotonically from ~0 dB at 4 kHz to +4 dB at 5 kHz) -- the A&E prose is a nominal spec
    target, not the plotted unit; reported values follow the plotted curve. Digitized extent is
    the drawn solid line ~51.6 Hz to 20 kHz (the plot spans 20 Hz-20 kHz; the published
    general-curve range is 45 Hz-18 kHz).
license_note: >
  Data are factual (frequency->dB) read from the public official Engineering Data Sheet chart,
  not a reproduction of the original figure. The original figure (PDF/PNG) is NOT included in the
  repo; only the source URL + page are recorded.
