brand: Neumann
model: U 87 Ai
type: condenser
polar_patterns: [cardioid, omni, figure-8]   # multi-pattern LDC; THIS curve is the cardioid response only
frequency_range_hz: [20, 20000]              # chart frame spans 20 Hz .. 20 kHz
source:
  url: https://www.neumann.com/en-us/products/microphones/u-87-ai
  asset: "https://assets.sennheiser.com/assets/Frequency-diagram-U-87-Ai-cardioid.svg (official product-page frequency diagram, CARDIOID pattern; Neumann is a Sennheiser brand, assets.sennheiser.com is the official CDN. Cardioid / omni / figure-8 are published as three SEPARATE SVG files; this is the cardioid file. Live download required the CDN's tokenized path variant.)"
  page: "web (product page 'Data & Diagrams' section; vector SVG asset, no PDF page)"
  chart: "Frequency response diagram — U 87 Ai (cardioid, 0deg free-field, nominal solid curve)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Source is the OFFICIAL Neumann vector SVG (Frequency-diagram-U-87-Ai-cardioid.svg) from the
  U 87 Ai product page. The U 87 Ai's three polar patterns are published as three separate SVGs;
  this is the CARDIOID file. The file encodes TWO white stroked paths: cls-10 is the nominal 0deg
  free-field cardioid response (flat mids, presence lift, LF/HF rolloff); cls-9 is the switchable
  low-cut / high-pass FILTER curve (rises from ~-20 dB at 50 Hz to 0 dB at ~1 kHz, matching the
  high-pass filter icon on the chart). ONLY the cardioid response (cls-10) was digitized; the
  low-cut filter curve (cls-9) was NOT. Only the cls-10 stroke color was changed to red so the
  raster tracer could isolate it by --target-color (geometry untouched); rendered to PNG at 16x
  (2597x739) with cairosvg on a white background (cls-9 stayed white and vanished on white).
  Calibration anchors were read from the SVG's own grid geometry (shares the exact chart template
  as the TLM 103 diagram) and confirmed against the RENDERED axis LABELS
  (X: 20/50/100/200/500/1k/2k/5k/10k/20kHz, decade 51.05 svg-units, 100 Hz @ svg-x 41.46 /
  10 kHz @ svg-x 143.55; Y: labeled majors +10/0/-10/-20 dB, 0 dB @ svg-y 19.52, ~1.0255 svg-u/dB).
  At 16x render scale that gives px anchors X: 100 Hz@663.36, 10 kHz@2296.8; Y: +10 dB@148.48,
  -10 dB@476.64. Non-circular check: the SVG's labeled major gridlines (cls-4/cls-5/cls-3) land
  exactly on the read axis labels (50/100/200/500/1k/2k/5k/10k Hz; +10/0/-10 dB), and svg_coord*16
  matches the raster --detect-lines output. Seeded-viterbi trace + --simplify 0.05 dB perceptually
  lossless downsample (29 points). Cross-checked with an INDEPENDENT exact-bezier evaluation of the
  cls-10 path (flattened, transform translate(-3.59,-5.58) applied, same calibration): trace-vs-exact
  median 0.063 / max 0.339 dB over 29 pts (max at the steep 20 kHz tail). Features land where the
  published U 87 Ai cardioid character predicts: flat mids ~0 dB, wide presence lift ~+2.4 dB peak
  around 8-9 kHz, gentle LF slope to ~-7.8 dB at 20 Hz, HF rolloff to ~-9.6 dB near 20 kHz.
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: vector-path-extraction
    condition: "cardioid 0deg free-field on-axis response as published (nominal solid curve; excludes the switchable low-cut/high-pass filter curve; presence lift ~+2.4 dB @ ~8-9 kHz)"
verification:
  method: "overlay_verify.py --interpolated vs rendered official chart (--target-color 255,0,0) + independent exact-bezier cross-check"
  date: 2026-07-09
  result: >
    overlay (29 pts): matched 29/29, median |dev| 0.003 dB, max 0.005 dB, 0 gaps, 0 ambiguous.
    interpolated (2448 measured columns): median 0.017 dB, max 0.05 dB, 0 gaps, 0 ambiguous.
    independent exact-vector cross-check: median 0.063 dB, max 0.339 dB (max at steep 20 kHz tail).
license_note: >
  數據為事實資料（frequency→dB），從公開官方 Neumann U 87 Ai 產品頁的頻響圖（cardioid vector SVG）判讀，
