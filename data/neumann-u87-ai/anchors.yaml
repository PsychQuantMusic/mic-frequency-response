    points:
      - { freq_hz: 20, expected_db: -7.8, tol_db: 0.5 }
      - { freq_hz: 100, expected_db: 0.16, tol_db: 0.5 }
      - { freq_hz: 1000, expected_db: 0.09, tol_db: 0.5 }
      - { freq_hz: 8616.9, expected_db: 2.47, tol_db: 0.5 }
      - { freq_hz: 19850.7, expected_db: -9.6, tol_db: 0.5 }
