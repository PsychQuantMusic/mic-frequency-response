brand: Neumann
model: KM 184
type: condenser
polar_patterns: [cardioid]        # small-diaphragm cardioid (KK 184 capsule; Series 180)
frequency_range_hz: [20, 20000]   # chart frame spans 20 Hz .. 20 kHz; traced curve covers full span
source:
  url: https://www.neumann.com/en-us/products/microphones/km-184-series-180
  asset: "https://assets.sennheiser.com/assets/Frequency-diagram-KK-184_KM-A_KM-D_KM-184.svg/Zz04ZGEzMDgxNGRjMjAxMWYwOTcyOWFhNzJhZjY2MTljMg== (official product-page frequency diagram; shared cardioid-capsule chart for KK 184 / KM A / KM D / KM 184. Neumann is a Sennheiser brand, assets.sennheiser.com is the official CDN)"
  page: "web (product page 'Data & Diagrams' section; vector SVG asset, no PDF page)"
  chart: "Frequency response diagram — KK 184 / KM 184 (0deg free-field, nominal solid curve)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Source is the OFFICIAL Neumann vector SVG (Frequency-diagram-KK-184_KM-A_KM-D_KM-184.svg)
  from the KM 184 (Series 180) product page. The file encodes the nominal 0deg free-field
  response as a solid white bezier path (class cls-9, inside group id="KM184" carrying
  transform="translate(-3.59 -5.58)"); a dashed +/-~2 dB tolerance envelope (cls-10, two
  symmetric paths, same transform) was NOT digitized. Only the cls-9 stroke color was changed
  to pure red so the raster tracer could isolate it by --target-color (geometry untouched);
  rendered to PNG at 16x (2597x739) with cairosvg on white background (the white tolerance
  band vanishes on white). CRITICAL calibration note: the gridlines (group id="FQ-Raster")
  are NOT transformed, but the cls-9 curve IS (translate applied to the path element itself) —
  the raster trace naturally captures the transformed, rendered geometry, so calibration was
  done against the RENDERED image, not raw path coords. Calibration was triple-confirmed:
  (a) SVG grid geometry x 16x scale, (b) gray-gridline pixel detection in the rendered PNG,
  (c) visual read of the rendered axis LABELS (X: 20/50/100/200/500/1k/2k/5k/10k/20kHz,
  decade 51.05 u -> 100 Hz@px663.4 / 10 kHz@px2296.8; Y: labeled majors +10/0/-10/-20 dB,
  0 dB@px311.5, ~16.4 px/dB). All decade gridlines matched detection within 1 px.
  Seeded-viterbi trace + --simplify 0.05 dB perceptually lossless downsample (36 points).
  Independently cross-checked by parsing the cls-9 bezier path directly, applying the
  translate(-3.59 -5.58) transform, flattening (60 samples/segment), and mapping through the
  same calibration: trace-vs-exact-vector median 0.029 / max 0.057 dB. Features land where the
  published KM 184 character predicts: flat mids ~0 dB, gentle LF slope to ~-11.7 dB at 20 Hz,
  characteristic presence lift peaking ~+2.1 dB at ~8.5 kHz, HF rolloff to ~-1.2 dB at 20 kHz.
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: vector-path-extraction
    reproduction_status: vector-source-recorded
    formal_point_count: 36
    formal_frequency_span_hz: [20.198, 19850.73]
    verification_relation: current-csv-directly-verified
    condition: "0deg free-field on-axis response as published (cardioid; nominal solid curve, excludes dashed tolerance band; presence lift ~+2.1 dB @ ~8.5 kHz)"
verification:
  curves: [frequency-response--typical.csv]
  method: "overlay_verify.py --interpolated vs rendered official chart (--target-color 255,0,0) + independent exact-bezier cross-check"
  date: 2026-07-09
  result: >
    overlay (36 pts): matched 36/36, median |dev| 0.003 dB, max 0.005 dB, 0 gaps, 0 ambiguous.
    interpolated (2442 measured columns): median 0.008 dB, max 0.049 dB, 3 gaps (sub-pixel
    anti-alias dropouts, 3 of 2442 cols), 0 ambiguous.
    independent exact-vector cross-check (182 samples): median 0.029 dB, max 0.057 dB.
license_note: >
  數據為事實資料（frequency→dB），從公開官方 Neumann KM 184 (Series 180) 產品頁的頻響圖（vector SVG）判讀，
