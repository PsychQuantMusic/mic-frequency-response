brand: Shure
model: SM7B
type: dynamic
polar_patterns: [cardioid]
frequency_range_hz: [50, 20000]
source:
  url: https://pubs.shure.com/view/guide/SM7B/en-US.pdf
  page: 10
  chart: "Typical Frequency Response (Flat / Bass Rolloff / Presence Boost) + Polar Pattern (p.11)"
  retrieved: 2026-07-08
digitized_by: che (via Claude)
digitized_on: 2026-07-08
method: >
  AI 視覺判讀官方 user-guide。FR 圖(p.10)含三條 switch-setting 曲線（Flat 實線、
  Bass Rolloff 長虛線、Presence Boost 點線）。原圖含同色黑網格，pixel-trace 不適用（#3）。
  以 column-scan 作第一手，並在三曲線分岔區（低頻 flat vs bass-rolloff、presence 2-6kHz
  flat vs presence-boost）逐一放大目讀分離。best-effort ±0.5 dB（陡降段/wiggle 區更大）。
  三 switch 為 Flat 基準的獨立修改：bass-rolloff 僅改 <400Hz、presence-boost 僅抬 1.25-6.3kHz，
  其餘與 flat 共用（含 8-20kHz rolloff）。
curves:
  - file: frequency-response--flat.csv
    condition: "Flat Response switch setting (default; solid curve)"
  - file: frequency-response--bass-rolloff.csv
    condition: "Bass Rolloff switch (low end attenuated below ~400 Hz; long-dash curve; merges with flat above 400 Hz)"
  - file: frequency-response--presence-boost.csv
    condition: "Presence Boost switch (2-6.3 kHz raised ~+3.5 dB; dotted curve; = flat elsewhere)"
  - { file: polar-pattern--250hz.csv,  kind: polar-pattern, condition: "250 Hz (p.11 left polar chart, solid)" }
  - { file: polar-pattern--500hz.csv,  kind: polar-pattern, condition: "500 Hz (left chart, gray dash)" }
  - { file: polar-pattern--1000hz.csv, kind: polar-pattern, condition: "1000 Hz (left chart, black dash)" }
  - { file: polar-pattern--2500hz.csv, kind: polar-pattern, condition: "2500 Hz (right polar chart, solid; broad rear lobes)" }
  - { file: polar-pattern--6300hz.csv, kind: polar-pattern, condition: "6300 Hz (right chart, gray dash; tighter pattern)" }
polar_read_note: >
  AI 視覺判讀，30° 取樣、精度 ±1.5~2 dB（小圖多曲線）。0° = on-axis（Shure 慣例圖底），
  180° = rear（圖頂）；發表圖左右對稱，記錄 0–180° 半平面即完整（外圈 0dB、5dB/圈、圓心 -25dB）。
  左圖 250/500/1000 Hz 三曲線幾乎重合（低頻控制良好），僅後方 heart-null 附近微異（1000 最外、500 最內）；
  180° 深 null ~-21~-23（V 尖近圓心）。右圖 2500Hz 寬 pattern（後方大 lobe），6300Hz 較緊。
verification:
  method: "overlay vs original chart (scripts/overlay_verify.py, #6)"
  date: 2026-07-08
  result: >
    FR (3 曲線各 38 pts): flat median |dev| 0.27 dB；bass-rolloff 0.64；presence-boost 0.49。
    超標點集中於三曲線分岔區（scan 抓到鄰近曲線的量化歧義）與 15-20kHz 陡降 cliff；
    每條 overlay 目檢確認 marker 貼合各自 line-type 曲線（flat 走 solid、bass-rolloff 低頻走 long-dash、
    presence-boost 於 2-6kHz 走 dotted）。
  note: >
    三 switch 共用 8-20kHz rolloff（wiggle 8-13kHz 繞 0dB，14kHz 起陡降至 ~-14dB@19kHz，20kHz 微 hook 回 -12.5）。
polar_verification:
  method: "polar overlay vs original charts (scripts/overlay_verify.py --polar, #7)"
  date: 2026-07-08
  result: >
    左圖 250Hz median |dev| 0.90 dB (max 1.32)；右圖 2500Hz 0.36 (全 ±1.0 內)、6300Hz 0.65。
    500/1000Hz 與 250Hz 近重合、以相同校準讀取並套後方微差。全部 within declared ±2 dB。
license_note: >
