polar_note: >
  官方 p.2 有發表 polar pattern，但為「8 條彩色曲線的左右半分圖」：左半（cyan）125/250/500/1000 Hz、
  右半（purple）2000/4000/8000/16000 Hz，0° 在上（Sennheiser 慣例）、外圈 0dB、5dB/圈。
  同色群組曲線在前方（0-90°）近乎完全重合、後方以難以分辨的虛線樣式交疊；此密度下無法在 facts-only
  標準下可靠地逐頻分離判讀，故本批**未** digitize polar 各曲線（誠實跳過優於輸出不可靠數據）。
  FR 已捕捉主要頻譜行為。未來若要補 polar：需更高解析原圖 + 逐色/逐線型分離的 tracer。
verification:
  scope_note: >
    curves[].formal_point_count 與 formal_frequency_span_hz 描述目前正式 CSV。
    若 verification_relation 為 retained-unmodified-subset-of-verified-trace，result 的統計可能描述裁切前已驗證 trace；
    正式 CSV 只刪除原廠範圍外或來源無資料缺口後的列，保留列的頻率與 dB 數值未改寫。
  curves: [frequency-response--typical.csv]
  method: "overlay --interpolated vs original chart (scripts/overlay_verify.py, #14)"
  date: 2026-07-09
  result: >
    2026-07-09 全解析度再生 trace：median 0.004 / max 0.052 dB over 1019 measured cols，
    0 ambiguous、零 gap。原再生輸出 194 點；依原廠 40–18,000 Hz 標示範圍裁切後，正式 CSV
    保留其中 193 點（55.689–17,811.239 Hz），是已驗證 trace 的未改寫子集合。
  note: >
    presence lift 為 e935 招牌（4-10kHz broad ~+5 dB）；高頻於 ~12kHz 後陡降至 -21dB@20kHz。
    前述 20 kHz 是來源圖特徵，不在正式 CSV；CSV 自 55.689 Hz 清晰起點記至 17,811.239 Hz。
