brand: Sennheiser
model: e904
type: dynamic
polar_patterns: [cardioid]
frequency_range_hz: [40, 18000]
source:
  url: https://www.sennheiser.com/globalassets/digizuite/41688-en-sp_1214_v1.0_e_904_product_specification_en.pdf
  page: 2
  chart: "Frequency Response (0°, 1 m)"
  scale: "dBV absolute; digitized as relative dB (0 dB = -50 dBV gridline, same anchor as e935)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Headless seeded-viterbi trace（單曲線真實圖）。官方 product-specification FR 圖（p.2）為藍色
  曲線（cyan，RGB 0,146,212），與黑色網格不同色，故用 --target-color 0,146,212 精確抽線。
  校準以 detect-lines 找網格線 + 逐一實讀軸標籤值：X 軸 log Hz（50/100/200/500/1k/2k/5k/10k/20k
  九個標籤全部對上偵測到的網格線、decade 寬約 409.5 px 一致，非 log 型態推測），Y 軸 dBV 線性
  （-40…-90，每格 10 dB）。錨定 0 dB = -50 dBV 網格線（與 e935 同慣例，同廠同軸，便於跨麥比較）；
  中頻平台落在 -56 dBV ≈ -6 dB relative。以 --simplify 0.05 dB 感知無損降採樣（200 點）。
  best-effort ±0.5 dB。
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: seeded-pixel-trace
    condition: "on-axis (0°, 1 m) typical response, relative to -50 dBV gridline (0 dB)"
polar_note: >
  官方 p.2 有發表 polar pattern，為「8 條彩色曲線的左右半分圖」：左半（cyan）125/250/500/1000 Hz、
  右半（purple）2000/4000/8000/16000 Hz，0° 在上（Sennheiser 慣例）、外圈 0dB、5dB/圈。
  同色群組曲線在前方近乎重合、以難分辨的虛線樣式交疊；此密度下無法在 facts-only 標準下可靠地
  逐頻分離判讀，故本批**未** digitize polar 各曲線（誠實跳過優於輸出不可靠數據）。FR 已捕捉主要頻譜行為。
verification:
  method: "overlay --interpolated vs original chart (scripts/overlay_verify.py, #14)"
  date: 2026-07-09
  result: >
    重繪保真驗證（沿內插折線逐欄比對）：median 0.004 / max 0.052 dB over 1099 measured cols
    （0 ambiguous、零 gap，--target-color 藍曲線）。逐點 200/200 matched，median |dev| 0.002 /
    max 0.005 dB，全數在 ±1.0 dB 內。
  note: >
    e904 為 snare/tom 動圈鼓麥聲底：低頻於 ~150Hz 以下 rolloff（補償近接效應，40Hz ≈ -24dB relative）；
    中頻平台 ~-6 dB（200-500Hz）；自 ~500Hz 起寬廣 presence lift，於 4-8kHz 達 ~-1.6dB、~11kHz 尖峰
    -0.73 dB（招牌 presence，約 +5 dB 高於中頻平台）；~12kHz 後高頻陡降（15kHz -14.6dB、18kHz -28dB）。
    曲線自左邊界 ~40Hz 起、繪至 ~19.4kHz。frequency_range_hz 依官方規格 40-18000。
license_note: >
