brand: Sennheiser
model: e914
type: condenser            # pre-polarised (back-electret) small-diaphragm condenser
polar_patterns: [cardioid]
frequency_range_hz: [20, 20000]
source:
  url: https://docs.cloud.sennheiser.com/en-us/evolution-wired/evolution-wired_instruction_manual_04_2026_en.pdf
  page: 196
  chart: "Frequency response (e 914 Specifications section) — three curves: flat / roll off / cut off"
  landing_page: https://docs.cloud.sennheiser.com/en-us/evolution-wired/evolution-wired/specifications-e914.html
  scale: "relative dB (chart labeled 'dB'; 0 dB = flat midband plateau, i.e. already a normalized response — no dBV conversion needed)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  seeded-viterbi trace of the OFFICIAL Sennheiser e 914 frequency-response chart, extracted
  from the evolution-wired instruction manual PDF (p.196, "4 - Specifications" / e 914), rendered
  from vector at 400 dpi (pdftoppm) and tightly cropped to the plot area.
  The chart shows THREE blue curves (flat / roll off / cut off = the switchable 6 dB/oct low-cut
  filter positions). Per task, the FLAT curve (low-cut filter OFF) was digitized — it is the
  topmost of the three (stays ~0 dB down to 40 Hz); the roll off (dash-dot) and cut off (dashed)
  curves dive at low frequency and were NOT digitized. All three curves are the same blue, so
  --target-color could not separate them; viterbi continuity from a seed on the flat curve stays
  on the topmost (flat) path, verified visually on the overlay.
  Traced --strategy viterbi --target-color 89,152,212, then --simplify 0.05 dB perceptual-lossless
  downsample (1830 -> 178 points). x-range = plotted range (left border 40 Hz @ px152, right border
  20,000 Hz @ px1988).
  Y axis is a normalized dB scale (0 dB = flat plateau), so the CSV is already relative — no dBV
  anchoring step (unlike e935/AT2020).
calibration:
  x_axis: "log Hz; 100 Hz @ px423, 10,000 Hz @ px1101->10k @ px1782 (2-pt cal 423,100 & 1782,10000)"
  x_cross_check: >
    calibration confirmed by log-structure fit across 9+ interior gridlines (200/300/400/500/600/
    700/800/900/1000/2000/3000/5000 Hz all land within 2 px of detected verticals; decade width
    678 px). INDEPENDENT feature cross-check: traced presence peak lands at ~11.8 kHz, +5.5 dB —
    matches published e914 behavior (~+5 dB at ~12 kHz). This rules out the log-axis whole-shift
    ambiguity (SKILL #14).
  y_axis: "linear dB; 0 dB @ px262, -20 dB @ px534 (grid lines +10/0/-10/-20/-30/-40 at px 126/262/398/534/670/804, 136 px per 10 dB). Axis labels 0/-10/-20 read directly."
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: seeded-pixel-trace
    condition: >
      on-axis (0deg) free-field frontal response, FLAT setting (switchable low-cut / bass roll-off
      filter OFF; sensitivity pad does not affect response shape). Relative to 0 dB midband plateau.
      Plotted range 40 Hz - 20 kHz (chart left border = 40 Hz).
verification:
  method: "overlay_verify.py --interpolated --target-color 89,152,212 (per-column reinterpolated deviation)"
  date: 2026-07-09
  points: 178
  matched: "178/178"
  interpolated_median_db: 0.003
  interpolated_max_db: 2.74
  gaps: 0
  ambiguous: 0
  result: >
    Median |dev| 0.003 dB across 1828 measured columns — the trace is a near-exact overlay on the
    FLAT curve (visually confirmed: green markers sit on the solid topmost curve end-to-end,
    including the +5.5 dB presence peak @ ~11.8 kHz and the roll-off to -4 dB @ 20 kHz).
  caveat: >
    The single elevated deviation (interp max 2.74 dB; one CSV point flagged at 296.8 Hz, dev
    -1.66 dB) is a MULTI-CURVE verification artifact, NOT a trace error: in the ~250-400 Hz band
    the roll off / cut off curves converge upward toward the flat curve, adding blue pixels below
    it, which pulls the overlay's per-column blue-centroid downward. The traced CSV value there
    (296.8 Hz -> -0.22 dB) is correctly on the flat curve (zoomed overlay confirms the green + on
    the solid line). Median (0.003) is the representative fidelity metric for this multi-curve chart.
  features:
    - "flat / extended bass to 40 Hz (flat setting): ~0 dB from 40 Hz through ~3 kHz"
    - "gentle presence lift building from ~4 kHz; secondary bump ~+2.5 dB near 6-7 kHz"
    - "main presence peak ~+5.5 dB at ~11.8 kHz (published: ~+5 dB @ 12 kHz)"
    - "high-frequency roll-off after the peak to ~-4 dB at 20 kHz"
license_note: >
  資料為事實對應（frequency→dB），從公開官方 Sennheiser 產品手冊（instruction manual, p.196）
  判讀，非原圖之重製。原圖（PDF/PNG）未收錄進 repo，只記來源 URL + 頁碼。
