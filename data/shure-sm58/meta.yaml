brand: Shure
model: SM58
type: dynamic
polar_patterns: [cardioid]
frequency_range_hz: [50, 15000]
source:
  url: https://pubs.shure.com/view/guide/SM58/en-US.pdf
  page: 6
  chart: "Typical SM58 Frequency Response"
  retrieved: 2026-07-08
digitized_by: che (via Claude)
digitized_on: 2026-07-08
method: >
  AI 視覺判讀官方頻響圖。未使用 digitizer/ 的 pixel-trace：Shure 官方圖有同色（黑）
  網格線橫跨每一欄，會污染 MVP 的全欄質心 tracer（見 #3 Phase 2 robust tracing）。
  數值為 best-effort 判讀（典型 ±0.5 dB，陡峭段誤差較大）。
curves:
  - file: frequency-response--typical.csv
    condition: "typical on-axis response (as published)"
  # kind 缺省 = frequency-response（向後相容）
  - { file: polar-pattern--125hz.csv,  kind: polar-pattern, condition: "125 Hz (user guide p.6 'Typical SM58 Polar Pattern', left chart, solid)" }
  - { file: polar-pattern--500hz.csv,  kind: polar-pattern, condition: "500 Hz (left chart, dotted)" }
  - { file: polar-pattern--1000hz.csv, kind: polar-pattern, condition: "1000 Hz (left chart, dashed)" }
  - { file: polar-pattern--2000hz.csv, kind: polar-pattern, condition: "2000 Hz (right chart, solid)" }
  - { file: polar-pattern--4000hz.csv, kind: polar-pattern, condition: "4000 Hz (right chart, dotted)" }
  - { file: polar-pattern--8000hz.csv, kind: polar-pattern, condition: "8000 Hz (right chart, dashed)" }
polar_read_note: >
  AI 視覺判讀，30° 取樣、精度 ±1.5 dB（小圖多曲線）。0° = on-axis；
  發表圖左右對稱，記錄 0–180° 半平面即完整（外圈 0dB、5dB/圈）。
verification:
  method: "overlay vs original chart (scripts/overlay_verify.py, #6)"
  date: 2026-07-08
  result: "median |dev| 0.29 dB, max 0.81 dB, 30/30 points within ±1.0 dB"
  note: >
    首輪驗證抓到陡降段 2 點偏差（11k/12.5k, +1.3~1.5 dB），依 overlay 回饋重讀修正後全數過檻。
license_note: >
  數據為事實資料（frequency→dB），從公開官方圖判讀，非原圖之重製。原圖（PDF/PNG）未收錄進 repo。
