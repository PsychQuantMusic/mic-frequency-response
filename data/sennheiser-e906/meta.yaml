method: >
  Headless seeded-viterbi trace（多曲線真實圖中的單一目標曲線）。官方 evolution wired
  product-specification（V1.1）FR 圖（p.2）畫了 3 條曲線——對應 e906 的三段式 presence
  切換開關（bright / moderate / dark，presence filter 中心頻率 4.2 kHz）。三條同為藍色家族
  但不同飽和度：bright（up-slope 開關圖示）RGB (5,187,238)、moderate/flat（middle 開關圖示，
  legend 標 "(0°, 1 m)"）RGB (0,146,212)、dark（down-slope 開關圖示）RGB (161,218,248)。
  **本檔數位化 MODERATE / flat（中間、linear）設定**——即 legend 中間那條、最飽和的藍
  RGB (0,146,212)，與 e935/e904/e835 單曲線圖同色。用 --target-color 0,146,212 精確抽線，
  color-tolerance/tolerance 設 40（L2 色距）：剛好排除 bright（色距 48.8）與 dark（色距 180），
  在三曲線分岔區（2–7 kHz）乾淨隔離 moderate 曲線；tolerance ≥44 時 bright 的抗鋸齒像素滲入、
  分岔區 overlay max 飆到 ~2.5 dB，故 40 為最佳點。
  校準以逐一實讀軸標籤值（非 log 型態推）+ detect-lines 網格線交叉核驗：
  X 軸 log Hz——實讀 9 個標籤 50/100/200/500/1k/2k/5k/10k/20k，每個標籤 anchor 皆對上偵測到的
  網格線（右框 x≈2900.5 = 20 kHz 為絕對定位錨），decade 寬 ≈408.9 px 一致（與 e904 ~409.5、
  e835 ~404.5 同 template）；左框 ≈40 Hz 吻合規格下限。Y 軸 dBV 線性，網格線 -40…-90 每 10 dBV
  ≈81.5 px；錨定 0 dB = -50 dBV 網格線（與 e935/e904/e835 同慣例，同廠同軸，便於跨麥比較）。
  獨立交叉核驗：trace 之 presence 尖峰落在 4134 Hz，與官方 presence filter 中心頻率 4.2 kHz 吻合，
  確認校準正確。以 --simplify 0.05 dB 感知無損降採樣（195 點）。best-effort ±0.5 dB。
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: seeded-pixel-trace
    condition: >
      on-axis (0°, 1 m), MODERATE / flat presence-switch position (middle switch icon,
