polar_note: >
  官方 p.2 有發表 polar pattern，為「8 條彩色曲線的左右半分圖」（Sennheiser 慣例）：左半（cyan）
  125/250/500/1000 Hz、右半（purple）2000/4000/8000/16000 Hz，0° 在上、外圈 0dB、5dB/圈。
  同色群組曲線在前方近乎重合、以難分辨的虛線樣式交疊；此密度下無法在 facts-only 標準下可靠地
  逐頻分離判讀，故本批**未** digitize polar 各曲線（誠實跳過優於輸出不可靠數據）。FR 已捕捉主要頻譜行為。
verification:
  method: "overlay --interpolated vs original chart (scripts/overlay_verify.py, #14), color-tolerance 40"
  date: 2026-07-09
  result: >
    重繪保真驗證（沿內插折線逐欄比對）：median 0.003 / max 0.736 dB over 1030 measured cols
    （0 ambiguous、全部點 ±1.0 dB 內，--target-color 藍 tolerance 40）。逐點 195/195 matched。
    **70 個 overlay measurement gap**（非 CSV 缺陷）集中在三曲線「再收斂/交疊」區——7.2–9.5 kHz
    （51 欄）與 15.7–17.2 kHz（18 欄），該處 moderate 曲線被 bright/dark 覆蓋（drawn under）、
    tolerance 40 濾不到純 moderate 像素故無法逐欄量測；viterbi 以連續性橋接，因三曲線在收斂區彼此僅
    相距 ~±0.7 dB，橋接值誤差受此曲線間距上界所限、屬誠實不確定帶而非誤判。分岔尖峰區（2–7 kHz）
    量測乾淨（此即 max 0.736 所在，無 gap）。
  note: >
    e906 為電吉他音箱動圈麥（supercardioid，flat shape 貼音箱面）。moderate/flat 設定聲底：
    低頻於 ~150 Hz 以下 rolloff（40 Hz ≈ -18 dB relative，補償近接效應）；中頻寬廣平台 ~-3.4 至
    -5.4 dB（200 Hz–2.5 kHz）；自 ~3 kHz 起寬廣 presence lift，於 ~4.1 kHz 達尖峰 +1.1 dB（招牌
    presence，約 +5 dB 高於中頻平台，presence filter 中心 4.2 kHz）；~8 kHz 有次尖峰 ~-2.3 dB；
    ~13 kHz 後高頻陡降（13 kHz -7.8 dB、17 kHz -21.7 dB、~20 kHz -25 dB）。曲線自左框 ~40 Hz 起、
    繪至右框 ~20 kHz。frequency_range_hz 依官方規格 40–18000。
