polar_note: >
  官方 p.2 有發表 polar pattern，為「8 條彩色曲線的左右半分圖」（Sennheiser 慣例）：左半（cyan）
  125/250/500/1000 Hz、右半（purple）2000/4000/8000/16000 Hz，0° 在上、外圈 0dB、5dB/圈。
  同色群組曲線在前方近乎重合、以難分辨的虛線樣式交疊；此密度下無法在 facts-only 標準下可靠地
  逐頻分離判讀，故本批**未** digitize polar 各曲線（誠實跳過優於輸出不可靠數據）。FR 已捕捉主要頻譜行為。
verification:
  scope_note: >
    curves[].formal_point_count 與 formal_frequency_span_hz 描述目前正式 CSV。
    若 verification_relation 為 retained-unmodified-subset-of-verified-trace，result 的統計可能描述裁切前已驗證 trace；
    正式 CSV 只刪除原廠範圍外或來源無資料缺口後的列，保留列的頻率與 dB 數值未改寫。
  curves: [frequency-response--typical.csv]
  method: "overlay --interpolated vs original chart (scripts/overlay_verify.py, #14), color-tolerance 40"
  date: 2026-07-09
  result: >
    原始全幅重繪驗證為 median 0.003 / max 0.736 dB over 1030 measured cols；但 7.2–9.5 kHz
    與 15.7–17.2 kHz 共 70 欄沒有可辨識的 moderate 純像素，原 trace 曾以連續性橋接。
    正式 CSV 因此在第一個缺口前停止，只保留 40 Hz–6.948 kHz 的 164 個可量測點；保留區間
    沒有 measurement gap，且全部 overlay 偏差在 ±1.0 dB 內。缺口後即使重新出現可見像素，
    目前兩欄 CSV 無法表達不連線的分段曲線，故一律不收錄，避免把橋接或跨 gap 連線當成官方資料。
  note: >
    e906 為電吉他音箱動圈麥（supercardioid，flat shape 貼音箱面）。moderate/flat 設定聲底：
    低頻於 ~150 Hz 以下 rolloff（40 Hz ≈ -18 dB relative，補償近接效應）；中頻寬廣平台 ~-3.4 至
    -5.4 dB（200 Hz–2.5 kHz）；自 ~3 kHz 起寬廣 presence lift，於 ~4.1 kHz 達尖峰 +1.1 dB（招牌
    presence，約 +5 dB 高於中頻平台，presence filter 中心 4.2 kHz）。來源圖繼續繪到約 20 kHz，
    但正式 CSV 在 6.948 kHz 後留白；frequency_range_hz 仍依官方規格記為 40–18000。
