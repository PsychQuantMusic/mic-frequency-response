method: >
  Seeded-viterbi pixel-trace（headless digitizer/cli.js），官方手冊圖 @600 dpi、crop 到
  plot area。X 軸校準以偵測到的 gridline + 各標籤 leader line 實讀交叉驗證：10 條
  1-2-5 log 標籤（20/50/100/200/500/1000/2000/5000/10000/20000 Hz）的 gridline 像素
  完美落在 365.5 px/decade 線性擬合上（殘差 <3 px），並以 D5 已知特徵（4–10 kHz
  presence 雙峰、~9 kHz 峰、20 kHz HF rolloff、70 Hz 低頻 rolloff）交叉核對——排除
  log 自相似的整軸偏移風險。Y 軸線性 dB（0 dB / −20 dB gridline 校準，10 dB/70 px）。
  圖上為 solid（far-field 頻響）+ dashed（下方另一條）雙曲線家族——**只數位化 solid 曲線**。
  --simplify 0.05 dB 感知無損降採樣（1026 → 362 點）。
