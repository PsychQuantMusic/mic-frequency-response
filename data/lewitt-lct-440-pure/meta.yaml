brand: Lewitt
model: LCT 440 PURE
type: condenser  # 1" true condenser, externally polarized (pressure gradient transducer)
polar_patterns: [cardioid]  # fixed cardioid
frequency_range_hz: [20, 20000]
source:
  url: https://www.lewitt-audio.com/sites/default/files/2018-05/l-manual-lct-440-pure-en-web.pdf
  page: 10
  chart: "Figure 9.1 - Frequency response of the LCT 440 PURE"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Seeded-viterbi pixel-trace of the official Lewitt LCT 440 PURE user-manual FR chart
  (Figure 9.1, p.10), rendered at 400 dpi (pdftoppm) and cropped tightly to the plot area.
  Curve is a solid Lewitt green on white with gray gridlines — traced with --target-color
  106,193,47 (gridlines/text naturally excluded), then --simplify 0.05 dB perceptually-
  lossless downsampling (48 points).
  Calibration: X log-axis anchored on read axis labels 20 Hz (x=159) and 20 kHz (x=4305),
  cross-checked against every intermediate labeled decade line (50/100/200/500/1k/2k/5k/10k
  all land within 1-3 px of log-predicted positions — decade width consistent). Y linear-dB
  anchored 20 dB (y=202) and -20 dB (y=1327), 28.1 px/dB. Calibration further cross-validated
  by published curve features: presence peak lands +4.98 dB @ ~13 kHz and secondary bump
  +3.8 dB @ ~4 kHz (matches Lewitt's voicing: gentle presence lift, low end ~-1.5 dB @ 20 Hz,
  flat ~0 dB through mids, HF rolloff back to ~0 dB @ 20 kHz).
curves:
  - file: frequency-response--typical.csv
    condition: "typical on-axis response (as published, cardioid; no filters — mic has no pad/HPF switches)"
verification:
  method: "overlay vs original chart (scripts/overlay_verify.py --interpolated, --target-color 106,193,47)"
  date: 2026-07-09
  result: >
    48 pts, matched 48, gaps 0, ambiguous 0. Per-point: median |dev| 0.002 dB, max 0.004 dB.
    Interpolated (4144 measured cols, redraw-fidelity along CSV polyline): median 0.011 dB,
    max 0.052 dB, 0 gaps, 0 ambiguous. All points within ±1.0 dB. Visual overlay: traced
    polyline indistinguishable from original green curve across full span.
license_note: >
  數據為事實資料（frequency→dB），從公開官方 Lewitt LCT 440 PURE user manual (Figure 9.1) 判讀，
  非原圖之重製。原圖（PDF/PNG）未收錄進 repo，僅記來源 URL + 頁碼。
