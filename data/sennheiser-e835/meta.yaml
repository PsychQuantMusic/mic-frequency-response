polar_note: >
  官方 p.2 有發表 polar pattern，為「8 條彩色曲線的左右半分圖」：左半（cyan）125/250/500/1000 Hz、
  右半（purple）2000/4000/8000/16000 Hz，0° 在上（Sennheiser 慣例）、外圈 0dB、5dB/圈。
  同色群組曲線在前方近乎重合、以難分辨的虛線樣式交疊；此密度下無法在 facts-only 標準下可靠地
  逐頻分離判讀，故本批**未** digitize polar 各曲線（誠實跳過優於輸出不可靠數據）。FR 已捕捉主要頻譜行為。
verification:
  scope_note: >
    curves[].formal_point_count 與 formal_frequency_span_hz 描述目前正式 CSV。
    若 verification_relation 為 retained-unmodified-subset-of-verified-trace，result 的統計可能描述裁切前已驗證 trace；
    正式 CSV 只刪除原廠範圍外或來源無資料缺口後的列，保留列的頻率與 dB 數值未改寫。
  curves: [frequency-response--typical.csv]
  method: "overlay --interpolated vs original chart (scripts/overlay_verify.py, #14)"
  date: 2026-07-09
  result: >
    重繪保真驗證（沿內插折線逐欄比對）：median 0.005 / max 0.051 dB over 1091 measured cols
    （0 ambiguous、零 gap，--target-color 藍曲線）。逐點 165/165 matched，median |dev| 0.002 /
    max 0.005 dB，全數在 ±1.0 dB 內。
  note: >
    e835 為 lead-vocal 動圈麥聲底（cardioid，gentle presence boost）：低頻自 ~40Hz 邊界起 rolloff
    （40Hz ≈ -15 dB relative，補償近接效應）；漸升至中頻平台 ~-2.4 dB（200-1000Hz）；自 ~1kHz 起
    寬廣 presence lift，於 ~5.1kHz 達尖峰 +2.5 dB（招牌 presence，約 +5 dB 高於中頻平台）；~10kHz 小
    隆起 +0.9 dB；~12kHz 後高頻陡降（15kHz -9.8dB、16kHz -12.4dB、~19.4kHz -19.6dB）。曲線自左邊界
    ~40Hz 起、繪至 ~19.4kHz。frequency_range_hz 依官方規格 40-16000。
