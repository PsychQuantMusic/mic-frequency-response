method: >
  Headless seeded-viterbi trace（單曲線真實圖）。官方 evolution wired product-specification（V1.1）
  FR 圖（p.2）為藍色曲線（cyan，RGB 0,146,212），與黑色網格不同色，故用 --target-color 0,146,212 精確抽線。
  校準以 detect-lines 找網格線 + 逐一實讀軸標籤值（關鍵：先前依 log 間距推測誤把 x=1962 當 50Hz，
  放大讀標籤後更正為 100Hz——正是 SKILL #14 警示的 log 自相似整軸偏移，實讀標籤破解）：
  X 軸 log Hz，實讀後對上 50@x1840 / 100@x1962 / 200@x2083 / 500@x2245 / 1k@x2366 / 2k@x2489 /
  5k@x2648 / 10k@x2771 / 20k@x2894（box 右緣，orig 座標），decade 寬約 404.5 px 一致，標準 log 分度
  （1,2,3,…,9,10）完全吻合；box 左緣 ~40Hz。Y 軸 dBV 線性（-40…-90，每格 5dB，8px/dB）。
  錨定 0 dB = -50 dBV 網格線（與 e935/e904 同慣例，同廠同軸，便於跨麥比較）；中頻平台落在 -52.4 dBV
  ≈ -2.4 dB relative、5kHz presence 尖峰 -47.5 dBV ≈ +2.5 dB relative。以 --simplify 0.05 dB 感知無損
  降採樣（165 點）。best-effort ±0.5 dB。
