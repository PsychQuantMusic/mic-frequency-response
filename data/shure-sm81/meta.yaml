brand: Shure
model: SM81
type: condenser
polar_patterns: [cardioid]
frequency_range_hz: [20, 20000]   # published spec; drawn flat curve spans ~37 Hz–20 kHz
source:
  url: https://pubs.shure.com/view/guide/SM81/en-US.pdf
  page: 6
  chart: "Typical Frequency Response"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Seeded-viterbi pixel-trace of the FLAT (full-range) response curve, then --simplify 0.05
  dB perceptual-lossless downsample (42 points). Source PDF rendered at 400 dpi
  (pdftoppm), plot area cropped from the SM81 user-guide page 6 "Typical Frequency Response".
  Calibration read directly from axis labels (NOT inferred from log spacing):
  X — 100 Hz @ px 712, 10 000 Hz @ px 1726 (labeled decade gridlines, confirmed by
  reading the "20/50/100/1000/10000/20000" + minor "2..9" tick labels with vision);
  cross-check 1000 Hz predicted px 1219 vs detected 1214 (Δ≈1% freq). Y — +10 dB @ px 280,
  -10 dB @ px 676; cross-check 0 dB predicted px 478 = detected 478 (exact).
  Feature cross-check: curve is flat within ±1.5 dB from ~37 Hz to ~16 kHz with a slight HF
  presence rise (+0.6 dB @ ~11–13 kHz) then rolls off to -2.1 dB at 20 kHz — consistent with
  the SM81 being a very flat SDC, confirming calibration (features land correctly).
switch_setting: >
  FLAT position. The SM81 has a 3-position low-frequency switch; this curve is the FLAT
  (full-range, no attenuation) response — the "(—)" curve on the chart. The other two chart
  curves (NOT digitized) are the low-frequency ROLLOFF (6 dB/oct below 100 Hz) and
  low-frequency CUTOFF (18 dB/oct below 80 Hz) switch positions. The -10 dB attenuator does
  not alter frequency response.
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: seeded-pixel-trace
    condition: "flat switch position, full-range on-axis at 1 m (as published)"
verification:
  method: "overlay vs original chart (scripts/overlay_verify.py --interpolated), redraw-fidelity check"
  date: 2026-07-09
  window_px: 12
  result: >
    interpolated (log-f polyline, per-column): median 0.016 dB, max 0.204 dB over 1350 measured
    columns, 0 gaps, 38 ambiguous (= vertical gridline columns). Per-point: median 0.027 dB,
    max 0.205 dB, 42/42 within ±1.0 dB.
  note: >
    A ±12 px search window is used (not the default ±40 px). At the default ±40 px the
    interpolated max inflates to ~1.8 dB because the window reaches the two adjacent low-cut
    switch curves (~13 px below the flat curve at 99 Hz and 223 Hz) and the "1 Meter" text box;
    those are neighboring artifacts, NOT trace error. Visual overlay confirms the green trace
    follows the flat (—) curve across the whole range. Multi-curve match ambiguity in the bass
    is a documented limitation of the overlay tool.
license_note: >
  數據為事實資料（frequency→dB），從公開官方 Shure 圖判讀，非原圖之重製。
  原圖（PDF/PNG）未收錄進 repo，只記來源 URL + 頁碼。
