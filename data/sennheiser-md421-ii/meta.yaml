brand: Sennheiser
model: MD 421-II
type: dynamic
polar_patterns: [cardioid]
frequency_range_hz: [30, 17000]   # published nominal; drawn curve spans ~40 Hz–20 kHz
source:
  url: https://www.sennheiser.com/globalassets/digizuite/47850-en-quick-guide_md_421-ii_07_2024.pdf
  page: 2
  chart: "Polar pattern and frequency response — frequency-response plot"
  scale: "dBv absolute (Y axis −40…−90 dBv, 10 dB/div); digitized as relative dB (0 dB = −50 dBv gridline, same anchor as e935/e904)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Headless seeded-viterbi trace（單曲線真實圖）。官方 Sennheiser MD 421-II Quick Guide (07/2024)
  的 frequency-response 圖（p.2）為單一藍色曲線（cyan，RGB 0,146,212），與黑色網格不同色，故用
  --target-color 0,146,212 精確抽線（黑網格天然被排除，0 ambiguous）。此圖為 5-position bass
  control 開關的 **M（music / 全低頻、最平坦、bass 衰減最少）** 設定：Quick Guide 只畫一條曲線＝M；
  同型 Product Specification (V1.1) p.2 把這條同形曲線明確標為「Basscontrol „M"」（其下的虛線族為
  bass control 造成的 dip，未 digitize）。校準以 detect-lines 找網格線 + 逐一實讀軸標籤值：
  X 軸 log Hz — 20/50/100/200/500/1k/2k/5k/10k/20k 十個標籤全部對上偵測到的垂直網格線
  （decade 寬 424 px 一致，非 log 型態推測；cal 用 100 Hz@px301 與 10 kHz@px1149，其餘八條 <1px
  吻合交叉核驗）；Y 軸 dBv 線性（−40…−90，每格 10 dB，85 px/10 dB）。錨定 0 dB = −50 dBv 網格線
  （與 e935/e904 同廠同軸同慣例，便於跨麥比較）；中頻平台落在約 −54 dBv ≈ −4 dB relative。
  以 --simplify 0.05 dB 感知無損降採樣（192 點）。best-effort ±0.5 dB。
curves:
  - file: frequency-response--typical.csv
    condition: >
      on-axis (0°) typical response, bass-control switch in position "M" (music / full bass,
      least low-frequency attenuation); relative to −50 dBv gridline (0 dB)
polar_note: >
  官方 p.2 有發表 polar pattern，為「8 條彩色曲線的左右半分圖」：左半（cyan）125/250/500/1000 Hz、
  右半（purple）2000/4000/8000/16000 Hz，0° 在上（Sennheiser 慣例）、外圈 0dB、5dB/圈。
  同色群組曲線在前方近乎重合、後方以難分辨的虛線交疊；此密度下無法在 facts-only 標準下可靠地
  逐頻分離判讀，故本批**未** digitize polar 各曲線（誠實跳過優於輸出不可靠數據）。FR 已捕捉主要頻譜行為。
verification:
  method: "overlay --interpolated vs original chart (scripts/overlay_verify.py, #14)"
  date: 2026-07-09
  result: >
    per-point: median |dev| 0.003 dB, max 0.005 dB (192/192 matched, 0 gaps).
    interpolated (逐欄沿內插折線): median 0.005 dB, max 0.051 dB over 1146 measured cols,
    0 gaps, 0 ambiguous（cyan target-color 抽線，黑網格全排除）。
  note: >
    低頻自 ~40 Hz 起（M 設定 ~−11.7 dB rel = −61.7 dBv），升至中頻平台 ~−4 dB rel（~−54 dBv）；
    presence lift 為 MD 421 招牌（peak +4.1 dB rel ≈ −45.9 dBv @ ~4.7 kHz，寬廣上中頻/高頻抬升），
    ~8–13 kHz 次平台 ~+1 dB，之後 ~13 kHz 起陡降至 −15 dB rel（−65 dBv）@ ~20 kHz。
    published nominal frequency range 30–17,000 Hz；圖上實繪曲線延伸 ~40 Hz–20 kHz，CSV 依實繪範圍記錄。
license_note: >
  數據為事實資料（frequency→dB），從公開官方 Quick Guide 頻響圖判讀，非原圖之重製。
