brand: Neumann
model: TLM 103
type: condenser
polar_patterns: [cardioid]        # fixed-cardioid large-diaphragm (K103 capsule, K67/87 lineage)
frequency_range_hz: [20, 20000]   # chart frame spans 20 Hz .. 20 kHz
source:
  url: https://www.neumann.com/en-us/products/microphones/tlm-103
  asset: "https://assets.sennheiser.com/assets/Frequency-diagram-TLM-103.svg (official product-page frequency diagram; Neumann is a Sennheiser brand, assets.sennheiser.com is the official CDN)"
  page: "web (product page 'Data & Diagrams' section; vector SVG asset, no PDF page)"
  chart: "Frequency response diagram — TLM 103 (0deg free-field, nominal solid curve)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Source is the OFFICIAL Neumann vector SVG (Frequency-diagram-TLM-103.svg) from the
  TLM 103 product page. The file encodes the nominal 0deg free-field response as a solid
  white bezier path (class cls-9); a dashed +/-~1.9 dB tolerance envelope (cls-10, two
  symmetric paths) was NOT digitized. Only the cls-9 stroke color was changed to red so the
  raster tracer could isolate it by --target-color (geometry untouched); rendered to PNG at
  16x (2597x739) with cairosvg on white background (the white tolerance band vanishes on
  white). Calibration anchors were read from the SVG's own grid geometry and confirmed against
  the RENDERED axis LABELS (X: 20/50/100/200/500/1k/2k/5k/10k/20kHz, decade 51.05 u,
  100 Hz@x=41.46 / 10 kHz@x=143.55; Y: labeled majors +10/0/-10/-20 dB, 0 dB@y=19.52,
  10 dB per major div ~= 1.027 u/dB). Seeded-viterbi trace + --simplify 0.05 dB perceptually
  lossless downsample (28 points). Cross-checked with an INDEPENDENT exact-bezier evaluation of
  the cls-9 path (flattened 50 samples/segment, same calibration): trace-vs-exact-vector median
  0.035 / max 0.204 dB over 28 pts (max at the steep 20 kHz tail). Features land where the
  published TLM 103 character predicts: flat mids, wide presence lift ~+3.9 dB peak in 6-13 kHz,
  gentle LF slope to ~-8 dB at 20 Hz, HF rolloff to ~-5 dB at 20 kHz.
curves:
  - file: frequency-response--typical.csv
    condition: "0deg free-field on-axis response as published (cardioid; nominal solid curve, excludes dashed tolerance band; presence lift ~+3.9 dB @ 6-13 kHz)"
verification:
  method: "overlay_verify.py --interpolated vs rendered official chart (--target-color 255,0,0) + independent exact-bezier cross-check"
  date: 2026-07-09
  result: >
    overlay (28 pts): matched 28/28, median |dev| 0.001 dB, max 0.005 dB, 0 gaps, 0 ambiguous.
    interpolated (2441 measured columns): median 0.012 dB, max 0.049 dB, 0 gaps, 0 ambiguous.
    independent exact-vector cross-check: median 0.035 dB, max 0.204 dB.
license_note: >
  數據為事實資料（frequency→dB），從公開官方 Neumann TLM 103 產品頁的頻響圖（vector SVG）判讀，
  非原圖之重製。原始 SVG／渲染 PNG 未收錄進 repo，僅記來源 URL。
