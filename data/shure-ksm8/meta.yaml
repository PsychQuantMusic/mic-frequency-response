brand: Shure
model: KSM8
type: dynamic
polar_patterns: [cardioid]
frequency_range_hz: [40, 16000]
source:
  url: https://pubs.shure.com/view/guide/KSM8/en-US.pdf
  page: 6                       # printed page 6 = PDF page 8 ("Specifications" section)
  chart: "Frequency Response (0,6 m / 2 ft. from sound source)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Seeded-viterbi pixel trace（headless digitizer/cli.js）全解析度數位化後，以
  --simplify 0.05 dB 感知無損降採樣（886 -> 191 點）。原圖為官方 spec-sheet 的
  單曲線頻響圖（KSM8 為 dual-diaphragm dynamic，voicing 異常平坦、proximity 受控、
  presence 微升——曲線特徵與此相符，佐證校準正確）。原圖為黑網格 + 黑曲線（Shure 慣例），
  垂直網格欄會在量化時形成 ambiguous 欄（正常）。
  校準：4 點（x: 100Hz/10kHz 對 gridline，y: +20dB/-30dB frame），
  以第三、四條標籤線（20Hz/1kHz/20kHz、+10/-5dB）交叉覆核 decade 寬度一致（350px/decade），
  軸標籤值以 vision 實讀、非由 log 間距推得。
  KSM8 有 black（KSM8/B）與 nickel（KSM8/N）兩款外觀，共用同一 cartridge / 頻響。
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: seeded-pixel-trace
    reproduction_status: legacy-overlay-verified
    formal_point_count: 179
    formal_frequency_span_hz: [50.733, 15859.377]
    verification_relation: retained-unmodified-subset-of-verified-trace
    condition: "typical on-axis response, 0.6 m (2 ft.) from sound source (as published, single far-field curve)"
verification:
  scope_note: >
    curves[].formal_point_count 與 formal_frequency_span_hz 描述目前正式 CSV。
    若 verification_relation 為 retained-unmodified-subset-of-verified-trace，result 的統計可能描述裁切前已驗證 trace；
    正式 CSV 只刪除原廠範圍外或來源無資料缺口後的列，保留列的頻率與 dB 數值未改寫。
  curves: [frequency-response--typical.csv]
  method: "overlay redraw fidelity vs original chart (scripts/overlay_verify.py --interpolated, #14)"
  date: 2026-07-09
  result: >
    interpolated redraw：875 measured cols，median 0.026 / max 1.509 dB，零 gap，
    34 ambiguous（= 黑色垂直網格欄，不可量測，屬預期）。逐點：191 點 / 187 matched，
    median |dev| 0.069 dB。
  note: >
    唯一 >1.0 dB 的離群點是最右端 20,104 Hz（+1.51 dB）——落在 20kHz 右框垂直線上，
    overlay 量化的「最寬暗 run」在該邊界欄抓到框線而非曲線中心，屬驗證工具的 frame-edge
    量測 artifact，非 trace 誤差（視覺 overlay 確認綠線於陡降段全程貼合曲線至底）。
    其餘 874 欄 median 0.026 dB。曲線繪製範圍約 50 Hz–20 kHz（發表圖實際畫出的範圍），
    寬於 spec 標示的 40–16,000 Hz——數位化忠實還原「圖上畫出的曲線」。
license_note: >
  數據為事實資料（frequency→dB），從公開官方圖判讀，非原圖之重製。原圖（PDF/PNG）未收錄進 repo。
