brand: Audio-Technica
model: AT2020
type: condenser
polar_patterns: [cardioid]
frequency_range_hz: [20, 20000]
source:
  url: https://docs.audio-technica.com/us/at2020_english.pdf
  chart: "Frequency Response (12\" or more on axis)"
  scale: "5 dB per division"
  retrieved: 2026-07-08
digitized_by: che (via Claude)
digitized_on: 2026-07-09  # FR regenerated (#14); original 2026-07-08
method: >
  【#14 再生 2026-07-09】FR 曲線以 seeded-viterbi trace 全解析度重新數位化並以
  --simplify 0.05 dB 感知無損降採樣（52 點）；重繪保真驗證（overlay --interpolated，
  沿內插折線逐欄比對）：median 0.014 / max 0.063 dB over 1226 measured cols（71 ambiguous=垂直網格欄），零 gap（plot-area crop 後 trace，杜絕圖外文字 hop）。
  以下為原 AI 判讀方法紀錄（historical）。
  polar 資料維持原判讀密度（shape-summary 級，非重繪級——加密為 #14 Residue）。
  AI 視覺判讀官方 datasheet 頻響圖。原圖含黑色網格線（粗頻率線 + 細 dB 線），
  pixel-trace 不適用（見 #3）。曲線平坦、5-15kHz slight HF rise。best-effort ±0.5 dB。
curves:
  - file: frequency-response--typical.csv
    condition: "typical on-axis response (12\" or more on axis, as published)"
  # kind 缺省 = frequency-response（向後相容）
  - { file: polar-pattern--200hz.csv,  kind: polar-pattern, condition: "200 Hz (datasheet 'Polar Pattern', dash-dot)" }
  - { file: polar-pattern--1000hz.csv, kind: polar-pattern, condition: "1 kHz (solid); 180° 為 null、達圖表下限（記為 -25，實際 ≤ -25）" }
  - { file: polar-pattern--5000hz.csv, kind: polar-pattern, condition: "5 kHz (dotted)" }
  - { file: polar-pattern--8000hz.csv, kind: polar-pattern, condition: "8 kHz (dashed)" }
polar_read_note: >
  AI 視覺判讀，30° 取樣、精度 ±2 dB（小圖 4 曲線交疊）。0° = on-axis（圖頂）；
  發表圖左右對稱，記錄 0–180° 半平面即完整（外圈 0dB、5dB/圈）。
verification:
  method: "overlay vs original chart (scripts/overlay_verify.py, #6)"
  date: 2026-07-08
  result: "median |dev| 0.15 dB, max 0.81 dB, 31/31 points within ±1.0 dB"
  note: >
    首輪驗證抓到 500Hz–16kHz 段系統性判讀過高（+1~2 dB，「形狀合理」目測不可見），
    依 overlay 回饋整段重讀後全數過檻。0dB 錨定：平坦區所在網格線（原圖為相對刻度、無 0dB 標籤）。
license_note: >
  數據為事實資料（frequency→dB），從公開官方 datasheet 判讀，非原圖之重製。原圖未收錄。
polar_verification:
  method: "polar overlay vs original chart (scripts/overlay_verify.py --polar, #7)"
  date: 2026-07-08
  result: >
    4 curves quantified (window ±15px ≈ ±2.6dB): median |dev| 0.85–1.35 dB — consistent with
    declared ±2 dB precision. Per-point quantification ambiguous on this 4-curve black-grid
    chart (1px rings inside search window; documented limitation) — visual overlay primary,
    no systematic misread visible; values retained.
