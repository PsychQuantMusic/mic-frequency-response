  date: 2026-07-08
  result: >
    FR (cardioid, 29 pts): median |dev| 0.036 dB, max 0.316 dB — red-channel scan 後全數 ±1.0 內。
    Polar: cardioid median 0.077、omni 0.033、figure-8 0.178 dB（figure-8 60° 在 null 陡峭過渡區 dev 1.85，視覺貼合）。
  note: >
    各 polar 頁的 pole 位置略異（cardioid/omni pole y≈449、figure-8 y≈490），逐頁量測校正；ring scale 一致（0dB@r373, 5dB/58px）。
