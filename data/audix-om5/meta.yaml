method: >
  Headless seeded-viterbi trace (digitizer/cli.js) on the official spec-sheet
  FREQUENCY RESPONSE chart, rendered from the vendor PDF at 400 dpi (pdftoppm)
  and cropped to the plot area (page-2 offset x0=200 y0=2375 -> chart.png 1323x320).
  Single navy-blue curve (median RGB 53,53,148) on a black grid -> colored-curve
  isolation via --target-color, so the black gridlines/labels are excluded natively.
  1178 traced points reduced to 153 by --simplify 0.05 (dB perceptually-lossless
  Douglas-Peucker). x-range bounded to the drawn blue extent (px 128-1307 ~ 38 Hz-19.1 kHz).
  Calibration cross-checked against actual read axis-label values (not inferred from log
  spacing): X anchored on interior gridlines 200 Hz@px444 / 7 kHz@px1116 (14.6 dec px),
  verified against the 20 Hz@px8.5 / 20 kHz@px1314.5 box borders and detected interior
  gridlines 40 Hz@140, 1 kHz@748, 3 kHz@956, 5 kHz@1052 (all within ~1 px of prediction);
  Y calibrated off the thin inner gridlines +5 dBm@px87 / 0 dBm@px160 (14.6 px/dB),
  cross-checked against the +10/-10 dBm thick box borders (predicted +10@14 vs detected 12,
  -10@306 vs detected 307). Feature sanity check confirms correct (non-shifted) calibration:
  -7 dB @ 50 Hz low rolloff, +2.1 dB low hump ~170 Hz, dip to ~0 dB ~800 Hz, broad presence
  plateau avg +5.1 dB across 3-11 kHz peaking +6.7 dB @ ~11.5 kHz, steep HF rolloff to
  -9.3 dB @ 19 kHz -- matches the published OM5 hypercardioid vocal shape (spec-sheet text:
  "naturally attenuated at 120 Hz", "mid-range tailored for presence").
  Y axis is labeled "dBm" (relative response), so values are relative dB.
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: seeded-pixel-trace
    condition: "typical on-axis response (as published)"
verification:
  method: "overlay vs original chart (scripts/overlay_verify.py --interpolated --target-color 53,53,148, #14)"
  date: 2026-07-09
  result: >
    153 points, all matched, 0 gaps, 0 ambiguous. Point-wise median |dev| 0.003 dB,
    max 0.273 dB. Interpolated redraw-fidelity (per-column along the linear-interp
    polyline in log-f space): 1177 measured columns, median 0.011 dB, max 0.273 dB,
    0 gaps, 0 ambiguous -- within thresholds (median <=0.05, max <=0.3). Colored curve
    => zero ambiguous columns as expected. Visual overlay confirms green markers track
    the blue curve across the full span (low rolloff tail, hump, dip, presence plateau
    ripples, ~11.5 kHz peak, steep HF rolloff).
