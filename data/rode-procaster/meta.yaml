brand: Rode
model: Procaster
type: dynamic
polar_patterns: [cardioid]
frequency_range_hz: [75, 18000]   # Rode published spec (75Hz ~ 18kHz); chart is drawn wider (~36Hz–20kHz), traced across full drawn extent
source:
  url: https://edge.rode.com/pdf/page/356/modules/1253/procaster_product_manual.pdf
  page: 4
  chart: "Frequency Response (dB re 1 V/Pa)"
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  FR 曲線以 seeded-viterbi trace 全解析度數位化（官方 Procaster instruction manual p.4，
  紅色單曲線 RGB≈237,29,36，--target-color 排除黑色網格與軸標文字），--simplify 0.05 dB
  感知無損降採樣（246 點）。校準用內部主網格線（dark-column scan）實讀軸標值（非 log 型態外推）：
  X 100Hz@px468 / 10000Hz@px1146（339 px/decade），以 1000Hz@px807.5 + 20Hz@px229.5 /
  20000Hz@px1252.5 邊框線多線交叉核驗一致（20Hz 預測 px231 vs 偵測 229.5、1000Hz 預測 px807
  vs 偵測 807.5）；Y +20dB@px295 / -30dB@px612（6.34 px/dB），0dB 預測 px421.8 與偵測 px423 相符。
  x-range 上限截於 20kHz 內部校準位置（px1248）以貼合 chart 範圍（邊框右緣繪製略寬 ~4.5px，
  未外推至 >20kHz）。曲線實繪自 ~36Hz 起（圖上未繪 20-36Hz 段）。
  軸標值以放大 crop Read 直接判讀（20Hz/100/1000/10 000/20 000；+20…-30 dB re 1 V/Pa），
  非由 log 間距推得，避免整軸偏移的循環校準陷阱。特徵落點交叉核驗：presence lift 峰在 6.6 kHz
  （5–10 kHz 區、符合 broadcast/voice 動圈麥的 presence rise），low-mid bump ~157 Hz、tailored
  低頻 rolloff（−6.3 dB @ 79 Hz），與 Procaster 已知 voicing 一致 → 校準方向正確。
  重繪保真驗證（overlay --interpolated，沿內插折線逐欄比對）：median 0.003 / max 0.052 dB
  over 931 measured cols，0 gaps、0 ambiguous（--target-color 紅，網格天然排除）。
curves:
  - file: frequency-response--typical.csv
    data_origin: official-published-curve
    digitization_method: seeded-pixel-trace
    condition: >
      on-axis typical response (as published); tailored broadcast/voice voicing — steep LF
      rolloff (curve drawn from ~36 Hz @ −29.6 dB, −6.3 dB @ 79 Hz), low-mid bump ~+1.6 dB @ 157 Hz,
      slight dip −1.4 dB @ 287 Hz, flat mids (~0 dB @ 1 kHz), broad HF presence lift peaking
      ~+4.2 dB @ 6.6 kHz, steep HF rolloff (−9.5 dB @ 18 kHz, curve end −21.2 dB @ 20 kHz)
verification:
  method: "overlay vs original chart (scripts/overlay_verify.py --interpolated, red --target-color)"
  date: 2026-07-09
  result: >
    FR (246 pts): point-wise median |dev| 0.003 dB, max 0.005 dB;
    interpolated 931 cols median 0.003 dB, max 0.052 dB, 0 gaps, 0 ambiguous.
    全數 ±1.0 dB 內。Feature cross-check: presence lift lands at 6.6 kHz（5–10 kHz region,
    符合 Procaster broadcast dynamic 特徵）；low-mid bump ~157 Hz + tailored LF rolloff 確認校準方向。
license_note: >
  數據為事實資料（frequency→dB），從公開官方 Rode Procaster instruction manual
  (procaster_product_manual.pdf p.4) 判讀，非原圖之重製。原圖（PDF/PNG）未收錄進 repo。
