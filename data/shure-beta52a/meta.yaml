brand: Shure
model: Beta 52A
type: dynamic
polar_patterns: [supercardioid]
frequency_range_hz: [20, 10000]   # published spec ("20 to 10,000 Hz"); plotted trace ink spans ~37 Hz–11 kHz
source:
  url: https://content-files.shure.com/Pubs/BETA/Beta52a_Spec_Sheet.pdf
  page: 1
  chart: "Frequency Response (Beta 52A Supercardioid Dynamic Kick Drum Microphone — Product Specifications, ©2015 Shure)"
  retrieved: 2026-07-09
  alt_source: https://pubs.shure.com/view/guide/BETA52A/en-US.pdf   # official user guide (same FR plot)
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  seeded-viterbi trace（headless CLI）+ --simplify 0.05 dB 感知無損降採樣（603 raw → 99 點）。
  校準：X 軸 log 頻率以偵測到的格線對照印製標籤 100/1000/10000 Hz（cal-x 220,100 724,10000），
  Y 軸 linear dB（cal-y 131,10 327,-10，0 dB @ y=229，~9.8 px/dB）；獨立特徵覆核通過
  （scoop 最低點落 ~250 Hz、presence peak 落 3.9 kHz，皆與官方文字規格「presence boost at 4 kHz」一致）。
  重繪保真驗證（overlay_verify.py --interpolated，沿內插折線逐欄比對）：
  solid-curve median 0.024–0.026 dB、gaps 0。
  ⚠ 此為【多曲線圖】：官方圖含 4 條近接距離曲線（3 mm / 25 mm / 51 mm 虛線 + 0.06 m/2 ft 實線），
  於低頻分離、~1.5 kHz 以上匯聚為單線。本 CSV 僅數位化 canonical 遠場「0.06 m (2 ft)」實線
  （free-field typical response，最能代表本麥克風固有音色）。目檢 overlay 確認 trace 全程貼合實線、
  未跳上虛線；預設窗量化的 max 3.93 dB 全數落在 390–840 Hz 匯聚區，為 overlay 視窗誤匹配到鄰近下降虛線
  （正偏差＝上方較高 dB 的虛線），非 trace 失真——縮小視窗至 10 px 即降為 max 0.85 dB。
