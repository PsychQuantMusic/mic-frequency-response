verification:
  scope_note: >
    curves[].formal_point_count 與 formal_frequency_span_hz 描述目前正式 CSV。
    若 verification_relation 為 retained-unmodified-subset-of-verified-trace，result 的統計可能描述裁切前已驗證 trace；
    正式 CSV 只刪除原廠範圍外或來源無資料缺口後的列，保留列的頻率與 dB 數值未改寫。
  curves:
    - frequency-response--typical.csv
    - frequency-response--proximity-3mm.csv
    - frequency-response--proximity-25mm.csv
    - frequency-response--proximity-51mm.csv
  method: "overlay vs original chart (scripts/overlay_verify.py --interpolated, #14)"
  date: 2026-07-09
  result: >
    interpolated (default window): 602 measured cols, median 0.026 dB, max 3.93 dB, gaps 0, ambiguous 20;
    point-wise median 0.048 dB, max 3.37 dB. 7 outliers (>1 dB) ALL in 390–840 Hz merge zone.
    tightened window=10 px (isolates solid curve): median 0.023 dB, max 0.85 dB, gaps 0, ambiguous 21.
    Visual overlay confirms green trace rides the solid '0.06 m (2 ft)' curve across full range
    (scoop, merge, 4 kHz presence peak, HF notch, steep rolloff) — outliers are dashed-curve mismatches, not trace error.
    Issue #16 近接曲線驗證：proximity-3mm、25mm、51mm 均已個別進行 overlay 覆核；
    各曲線內插 median |dev| 為 0.020–0.024 dB。另行重描的 0.06 m 曲線與 typical
    交叉檢查，median |dev| 0.158 dB。
  note: >
    ambiguous ≈ 20 columns = black vertical gridlines saturating their column (Shure black-grid convention).
    max metric inflated by multi-curve overlap region — a documented overlay limitation on converging-curve charts,
    NOT a redraw defect. Redraw fidelity of the solid curve is median ~0.024 dB.
