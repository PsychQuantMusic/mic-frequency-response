brand: Shure
model: Beta 87A
type: condenser                    # electret condenser (per spec sheet "Type: Electret Condenser")
polar_patterns: [supercardioid]
frequency_range_hz: [50, 20000]    # spec sheet "Frequency Response: 50 to 20,000 Hz"
source:
  url: https://pubs.shure.com/view/guide/BETA87A/en-US.pdf
  page: 7
  chart: >
    Frequency-response chart at bottom of p.7 (BETA87A user guide). Two curves distinguished
    by line style: SOLID = "60.6 mm (2 ft.)" far-field, DASHED = "1 cm (3/8 in.)" close/proximity
    (bass boost from proximity effect). ONLY the SOLID far-field curve was digitized as `typical`.
  retrieved: 2026-07-09
digitized_by: che (via Claude)
digitized_on: 2026-07-09
method: >
  Seeded-viterbi pixel-trace of the SOLID "60.6 mm (2 ft.)" far-field curve from the OFFICIAL
  Shure Beta 87A user-guide PDF (pubs.shure.com), page 7 frequency-response chart. PDF rendered
  at 400 dpi (pdftoppm), plot area cropped (2800x1300) to keep the axis-label text and the two
  internal curve labels out of the tracer's reach. Grayscale trace (black curve on gray grid,
  default dark-threshold): seed on the solid curve at a column isolated from both the vertical
  gridlines and the dashed curve; --x-range 610,2270 px (= 50 Hz .. ~19 kHz, the visible solid
  extent) so the left-hand text labels (x<610) are excluded and the tracer cannot hop onto the
  DASHED proximity curve (which sits >=8 dB above the solid across the LF region). --simplify 0.05
  dB perceptually-lossless downsample (98 points).
  Calibration read from detected gridline pixels and cross-checked against the axis LABEL values:
  X (log Hz) anchored 50 Hz @ x=610 and 10 kHz @ x=2088 (px/decade ~= 642, self-consistent with the
  other detected decade lines 200@995, 1000@1445, 2000@1640, 20000@2285); Y (linear dB) anchored
  +20 dB @ y=97 and -20 dB @ y=1087 (24.75 px/dB, 0 dB @ y=595, confirmed by detected +10/-10 lines
  @ 347/843). Feature cross-check against published Beta 87A character: presence peak lands at
  ~9 kHz (+4.8 dB) with a small ~7 kHz notch, and LF rolloff to ~-13 dB at 50 Hz — matches the
  spec, ruling out a whole-axis decade shift (a shift would place the peak at ~900 Hz or ~90 kHz).
curves:
  - file: frequency-response--typical.csv
    condition: >
      far-field on-axis response as published (SOLID "60.6 mm / 2 ft" curve; supercardioid,
      phantom-powered electret condenser). Excludes the DASHED "1 cm (3/8 in.)" close-mic
      proximity-boost curve. Presence rise ~+4.8 dB @ ~9 kHz; HF rolloff to ~-7 dB @ ~19 kHz;
      electronic LF rolloff to ~-13 dB @ 50 Hz.
verification:
  method: "overlay_verify.py --interpolated vs cropped official chart (grayscale, black curve)"
  date: 2026-07-09
  result: >
    98 pts matched 98/98, 0 gaps, 0 ambiguous. Per-point median |dev| 0.037 dB.
    Interpolated (1648 measured columns): median 0.017 dB, max 1.252 dB, 0 gaps, 0 ambiguous.
    Visual overlay confirms the green trace rides the SOLID far-field curve across the full span,
    not the dashed proximity curve.
  note: >
    2 columns exceed +/-1.0 dB (619 Hz +1.25 dB, 635 Hz +1.07 dB) in the ~600-800 Hz region where
    the DASHED proximity curve descends to merge with the solid curve. Confirmed by visual overlay
    to be a verifier measurement ambiguity (the interpolated column window catches the nearby
    dashed line's dark pixels), NOT a trace deviation. The solid curve itself is tracked correctly.
license_note: >
  數據為事實資料（frequency→dB），從公開官方 Shure Beta 87A user-guide PDF 的頻響圖判讀，
  非原圖之重製。原始 PDF／渲染 PNG 未收錄進 repo，僅記來源 URL。
