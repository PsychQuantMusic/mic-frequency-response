<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mic Frequency-Response Digitizer</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif;
      margin: 0; padding: 1rem 1.25rem; line-height: 1.5;
    }
    h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -.015em; margin: 0 0 .3rem; }
    .sub { opacity: .7; font-size: .8rem; margin: 0 0 1rem; }
    .panel {
      display: flex; flex-wrap: wrap; gap: 1.25rem;
      padding: .75rem 1rem; border: 1px solid rgba(128,128,128,.3);
      border-radius: 8px; margin-bottom: .75rem; align-items: flex-start;
    }
    fieldset { border: 1px solid rgba(128,128,128,.3); border-radius: 6px; margin: 0; padding: .5rem .75rem; }
    legend { font-size: .8rem; opacity: .7; padding: 0 .35rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: .2rem 0; font-size: .85rem; }
    .row label { width: 5.5rem; }
    input[type=number] { width: 5rem; }
    button { cursor: pointer; padding: .3rem .6rem; border-radius: 5px; border: 1px solid rgba(128,128,128,.4); background: transparent; font: inherit; }
    button.primary { border-color: #3a7; }
    button.active { background: #3a7; color: #fff; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .dot { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; vertical-align: middle; margin-left: .3rem; border: 1px solid rgba(128,128,128,.5); }
    .ok { color: #3a7; }
    .muted { opacity: .55; }
    #swatch { width: 1.4rem; height: 1.4rem; border-radius: 4px; border: 1px solid rgba(128,128,128,.5); display: inline-block; vertical-align: middle; }
    #status { font-size: .85rem; margin: .5rem 0; min-height: 1.2em; }
    .canvas-wrap { border: 1px solid rgba(128,128,128,.3); border-radius: 8px; overflow: auto; max-height: 75vh; }
    canvas { display: block; max-width: 100%; cursor: crosshair; }
    code { background: rgba(128,128,128,.15); padding: 0 .3rem; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>頻響圖 Digitizer</h1>
  <p class="sub">半自動像素追蹤 → CSV（<code>freq_hz,level_db</code>）· <a href="https://github.com/PsychQuantMusic/mic-frequency-response">mic-frequency-response</a> Phase 1</p>

  <div class="panel">
    <fieldset>
      <legend>1 · 圖片</legend>
      <div class="row"><input type="file" id="file" accept="image/*"></div>
    </fieldset>

    <fieldset>
      <legend>2 · 座標校準（4 點）</legend>
      <div class="row">
        <label>X1 頻率</label><input type="number" id="x1v" placeholder="20"> Hz
        <button id="x1pick">在圖上點</button><span class="dot" id="x1dot"></span>
      </div>
      <div class="row">
        <label>X2 頻率</label><input type="number" id="x2v" placeholder="20000"> Hz
        <button id="x2pick">在圖上點</button><span class="dot" id="x2dot"></span>
      </div>
      <div class="row">
        <label>Y1 電平</label><input type="number" id="y1v" placeholder="0"> dB
        <button id="y1pick">在圖上點</button><span class="dot" id="y1dot"></span>
      </div>
      <div class="row">
        <label>Y2 電平</label><input type="number" id="y2v" placeholder="-40"> dB
        <button id="y2pick">在圖上點</button><span class="dot" id="y2dot"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend>3 · 曲線</legend>
      <div class="row"><button id="colorpick">點曲線取色</button><span id="swatch"></span></div>
      <div class="row"><label>顏色容差</label><input type="range" id="tol" min="5" max="150" value="60"><span id="tolval">60</span></div>
      <div class="row"><button id="trace" class="primary">追蹤曲線</button></div>
    </fieldset>

    <fieldset>
      <legend>4 · 匯出</legend>
      <div class="row"><button id="export" disabled>下載 CSV</button></div>
      <div class="row muted" id="count">尚未追蹤</div>
    </fieldset>
  </div>

  <div id="status">載入一張頻響圖開始。</div>

  <div class="canvas-wrap"><canvas id="canvas" width="600" height="300"></canvas></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
